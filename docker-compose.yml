services:
  savings:
    image: pyss56/saving:latest
    container_name: savings-bank
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATA_DIR=/app/data
      # ---- 注册开关（ALLOW_REGISTER）----
      # 控制是否允许家长/儿童在登录页自行注册账号：
      #   - 未设置 / 0 / false：关闭注册（默认），登录页不显示「立即注册」，/api/auth/register 返回 403
      #   - 1 / true / yes / on：开启注册
      # 需要开放注册时，取消下面这行注释即可：
      # - ALLOW_REGISTER=1
    volumes:
      # 数据挂载到宿主机目录：./data = docker-compose.yml 所在目录下的 data/，方便直接查看和备份
      - ./data:/app/data
      # 若想用 Docker 命名卷（数据在 Docker 内部），改用下面这行，并取消底部 volumes 的注释：
      # - savings-data:/app/data
    restart: unless-stopped

# 使用命名卷时取消下面注释：
# volumes:
#   savings-data:
